<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d"><title id="t">Ninebot G30 v7.14 Pairing and Self-Bound AutoAuth</title><desc id="d">First pairing uses the scooter power button once; later boots try direct 0x5D authentication with the stored accepted key.</desc><rect width="1600" height="1000" fill="#071018"/><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#71879a"/></marker><marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ff7151"/></marker></defs><text x="80" y="78" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#f3f8ff">Ninebot G30 · v7.14 Pairing &amp; Self-Bound AutoAuth</text><text x="82" y="122" font-family="Arial,sans-serif" font-size="24" fill="#9aaebe">First pairing needs one physical confirmation. Later boots try direct 0x5D auth with the stored accepted key.</text><rect x="80" y="190" width="650" height="600" rx="24" fill="#0d1721" stroke="#ffb561" stroke-width="3"/><text x="108" y="238" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#f3f8ff">First pairing</text><text x="108" y="282" font-family="monospace" font-size="25" fill="#b8c9d8">BLE connect + notifications</text><text x="108" y="322" font-family="monospace" font-size="25" fill="#b8c9d8">0x5B INIT</text><text x="108" y="362" font-family="monospace" font-size="25" fill="#b8c9d8">fresh 16-byte dashboard key</text><text x="108" y="402" font-family="monospace" font-size="25" fill="#b8c9d8">0x5C  -&gt;  0x5C00</text><text x="108" y="442" font-family="monospace" font-size="25" fill="#b8c9d8">press power button once</text><text x="108" y="482" font-family="monospace" font-size="25" fill="#b8c9d8">0x5C01</text><text x="108" y="522" font-family="monospace" font-size="25" fill="#b8c9d8">SHA1(key || BLE_key)</text><text x="108" y="562" font-family="monospace" font-size="25" fill="#b8c9d8">0x5D(serial)  -&gt;  0x5D01</text><text x="108" y="602" font-family="monospace" font-size="25" fill="#b8c9d8">READY</text><text x="108" y="642" font-family="monospace" font-size="25" fill="#b8c9d8">store key + exact serial in NVS</text><rect x="870" y="190" width="650" height="420" rx="24" fill="#0d1721" stroke="#56e7ac" stroke-width="3"/><text x="898" y="238" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#f3f8ff">Later boot · AutoAuth</text><text x="898" y="282" font-family="monospace" font-size="25" fill="#b8c9d8">BLE connect + 0x5B INIT</text><text x="898" y="322" font-family="monospace" font-size="25" fill="#b8c9d8">load stored key for serial</text><text x="898" y="362" font-family="monospace" font-size="25" fill="#b8c9d8">SHA1(stored_key || BLE_key)</text><text x="898" y="402" font-family="monospace" font-size="25" fill="#b8c9d8">direct 0x5D(serial)</text><text x="898" y="442" font-family="monospace" font-size="25" fill="#b8c9d8">0x5D01  -&gt;  READY</text><text x="898" y="482" font-family="monospace" font-size="25" fill="#b8c9d8">no 0x5C</text><text x="898" y="522" font-family="monospace" font-size="25" fill="#b8c9d8">no power-button request</text><rect x="870" y="660" width="650" height="250" rx="24" fill="#151014" stroke="#ff7151" stroke-width="3"/><text x="898" y="708" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#f3f8ff">Safe fallback</text><text x="898" y="752" font-family="monospace" font-size="25" fill="#b8c9d8">direct 0x5D timeout / reject</text><text x="898" y="792" font-family="monospace" font-size="25" fill="#b8c9d8">clear stored self-bound key</text><text x="898" y="832" font-family="monospace" font-size="25" fill="#b8c9d8">disconnect + reset crypto state</text><text x="898" y="872" font-family="monospace" font-size="25" fill="#b8c9d8">one clean normal button pairing</text><line x1="730" y1="490" x2="865" y2="405" stroke="#71879a" stroke-width="6" marker-end="url(#arrow)"/><text x="760" y="438" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#9aaebe">next boots</text><line x1="1195" y1="610" x2="1195" y2="653" stroke="#ff7151" stroke-width="5" marker-end="url(#arrowRed)"/><rect x="80" y="830" width="650" height="82" rx="18" fill="#0b241c" stroke="#56e7ac" stroke-width="2"/><text x="110" y="867" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#56e7ac">VERIFIED</text><text x="260" y="867" font-family="Arial,sans-serif" font-size="22" fill="#d6e7df">normal 5B → 5C → button → 5D01 path</text><rect x="80" y="928" width="650" height="52" rx="18" fill="#261b0c" stroke="#ffb561" stroke-width="2"/><text x="110" y="961" font-family="Arial,sans-serif" font-size="20" fill="#ffcf8a">v7.14 direct reconnect remains BLE-firmware dependent</text></svg>